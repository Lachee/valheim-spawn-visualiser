name: Release

# Push a tag like v1.2.0 to build, bundle and publish a GitHub release.
# Can also be run manually from the Actions tab (enter a version).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.2.0, no leading v)'
        required: true

permissions:
  contents: write

env:
  BEPINEX_VERSION: 5.4.2360

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version '$VERSION' must look like 1.2.3"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      # Same approach as Jotunn: anonymous SteamCMD download of the dedicated server (app 896660),
      # which ships the same managed assemblies as the client, plus BepInExPack from Thunderstore.
      - name: Get Valheim build id
        id: valheimversion
        run: echo "valheimversion=$(curl -s https://api.steamcmd.net/v1/info/896660 | jq -r ".data.\"896660\".depots.branches.public.buildid")" >> "$GITHUB_OUTPUT"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Cache Valheim
        id: cachevalheim
        uses: actions/cache@v4
        with:
          path: ~/VHINSTALL
          key: valheim-${{ steps.valheimversion.outputs.valheimversion }}-BepInExPack-${{ env.BEPINEX_VERSION }}

      - name: Install SteamCMD
        if: steps.cachevalheim.outputs.cache-hit != 'true'
        uses: CyberAndrii/setup-steamcmd@v1

      - name: Prepare Valheim dependencies
        if: steps.cachevalheim.outputs.cache-hit != 'true'
        run: |
          wget -O bepinex.zip "https://thunderstore.io/package/download/denikson/BepInExPack_Valheim/${BEPINEX_VERSION}/"
          unzip -q bepinex.zip -d ~/BepInExRaw
          steamcmd +force_install_dir ~/VHINSTALL +login anonymous +app_info_update 1 +app_update 896660 validate +exit
          # The csproj expects the client layout (valheim_Data/Managed); Linux paths are case sensitive.
          mv ~/VHINSTALL/valheim_server_Data/ ~/VHINSTALL/valheim_Data/
          mv ~/BepInExRaw/BepInExPack_Valheim/* ~/VHINSTALL/

      - name: Set plugin version
        run: |
          sed -i -E 's/public const string Version = ".*";/public const string Version = "${{ steps.version.outputs.version }}";/' src/Plugin.cs
          grep -n 'public const string Version' src/Plugin.cs

      - name: Build
        run: |
          dotnet build SpawnVisualiser.csproj -c Release \
            -p:ValheimDir="$HOME/VHINSTALL" \
            -p:DeployToGame=false \
            -p:Version=${{ steps.version.outputs.version }}

      - name: Bundle zip
        id: bundle
        run: |
          VERSION=${{ steps.version.outputs.version }}
          ZIP="SpawnVisualiser-${VERSION}.zip"
          mkdir -p dist/package
          cp bin/Release/SpawnVisualiser.dll dist/package/
          cp README.md dist/package/
          sed "s/__VERSION__/${VERSION}/" thunderstore/manifest.json > dist/package/manifest.json
          if [ -f thunderstore/icon.png ]; then cp thunderstore/icon.png dist/package/; fi
          (cd dist/package && zip -r "../${ZIP}" .)
          unzip -l "dist/${ZIP}"
          echo "zip=dist/${ZIP}" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Spawn Visualiser ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: ${{ steps.bundle.outputs.zip }}
          body: |
            ## Installation

            1. Install [BepInExPack Valheim](https://thunderstore.io/c/valheim/p/denikson/BepInExPack_Valheim/) if you don't already have it.
            2. Copy `SpawnVisualiser.dll` from the zip into `Valheim/BepInEx/plugins/`, or install the zip with your mod manager's "install from file" option.
            3. In-game, press **J** to show or hide the overlay and **Shift+J** to switch ghost mode.

            The mod only runs on your own game, so you don't need it on the server.
